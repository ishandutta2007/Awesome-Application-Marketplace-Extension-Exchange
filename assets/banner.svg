<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: #334155; stroke-opacity: 0.15; stroke-width: 1; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 40px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #94a3b8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
    
    /* Dynamic pulsing and floating animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.12); }
    }
    @keyframes floatParticleA {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes floatParticleB {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(20px) translateX(-20px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
    }
    @keyframes orbitFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }

    .orb-1 { transform-origin: 200px 100px; animation: pulseGlow 7s ease-in-out infinite; }
    .orb-2 { transform-origin: 1000px 300px; animation: pulseGlow 9s ease-in-out infinite 2s; }
    .particle-1 { animation: floatParticleA 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticleB 8s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticleA 7s ease-in-out infinite 3s; }
    .flow-line { stroke-dasharray: 8 12; animation: orbitFlow 12s linear infinite; }
  </style>

  <!-- Deep space background canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle grid layout -->
  <g class="bg-grid">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Glowing background ambient orbs (stays in background) -->
  <g opacity="0.6">
    <circle class="orb-1" cx="200" cy="100" r="160" fill="#38bdf8" filter="url(#glow)" opacity="0.35" />
    <circle class="orb-2" cx="1000" cy="300" r="190" fill="#a855f7" filter="url(#glow)" opacity="0.35" />
    <circle cx="600" cy="200" r="120" fill="#6366f1" filter="url(#glow)" opacity="0.2" />
  </g>

  <!-- Dynamic connecting flow arcs in background -->
  <path class="flow-line" d="M 80 340 Q 300 80, 600 200 T 1120 100" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4" />
  <path class="flow-line" d="M 120 80 Q 400 320, 800 180 T 1100 320" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.35" />

  <!-- Animated ambient micro-nodes -->
  <g>
    <circle class="particle-1" cx="150" cy="240" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle class="particle-2" cx="280" cy="90" r="4" fill="#818cf8" filter="url(#subtleGlow)" />
    <circle class="particle-3" cx="950" cy="120" r="3.5" fill="#c084fc" filter="url(#subtleGlow)" />
    <circle class="particle-1" cx="1060" cy="260" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle class="particle-2" cx="480" cy="330" r="3" fill="#ec4899" filter="url(#subtleGlow)" />
    <circle class="particle-3" cx="720" cy="70" r="3.5" fill="#60a5fa" filter="url(#subtleGlow)" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, & Feature Pills -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Top Category Label -->
    <rect x="-140" y="-48" width="280" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.95" />
    <text x="0" y="-30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">🚀 THE CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title with Gradient fill -->
    <text class="title-text" x="0" y="32">
      Awesome Application Marketplace &amp; Extension Exchange
    </text>

    <!-- Subtitle (Clear, high-contrast foreground) -->
    <text class="subtitle-text" x="0" y="78">
      SaaS Storefronts • Cloud Marketplaces • Extension Registries • Open Source Catalogs
    </text>

    <!-- Bottom Feature Badges / Pills -->
    <g transform="translate(0, 130)">
      <!-- Pill 1: Revenue & Fee Mechanics -->
      <g transform="translate(-370, 0)">
        <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" />
        <text class="pill-text" x="110" y="26" text-anchor="middle">💰 Fee &amp; Commission Rates</text>
      </g>
      <!-- Pill 2: Valuation & Scale -->
      <g transform="translate(-125, 0)">
        <rect x="0" y="0" width="250" height="42" rx="21" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1.2" />
        <text class="pill-text" x="125" y="26" text-anchor="middle">📊 Scale, Valuations &amp; ARR</text>
      </g>
      <!-- Pill 3: Open-Source Registries -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1.2" />
        <text class="pill-text" x="110" y="26" text-anchor="middle">⭐ Open-Source App Stores</text>
      </g>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>
